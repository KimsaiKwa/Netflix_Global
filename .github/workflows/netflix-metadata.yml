name: Refresh Netflix Display Metadata

on:
  schedule:
    - cron: "15 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "enrich_metadata.py"
      - "health_check.py"
      - "publish_data.py"
      - "verified_title_aliases.json"
      - "tests/**"
      - ".github/workflows/netflix-metadata.yml"

permissions:
  contents: write
  issues: write

concurrency:
  # The weekly generator uses this same group.
  group: netflix-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A queued run must start from the latest published cache and rankings.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 -m py_compile enrich_metadata.py health_check.py publish_data.py 2>&1 | tee metadata-syntax.log
          python3 -m unittest discover -s tests -v 2>&1 | tee -a metadata-syntax.log

      - name: Refresh cached display metadata
        id: enrich
        if: steps.syntax.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          METADATA_WORKERS=2 \
          JUSTWATCH_MIN_INTERVAL_SECONDS=0.75 \
          python3 enrich_metadata.py 2>&1 | tee metadata-refresh.log

      - name: Validate browser-ready mirror
        id: validate
        if: steps.syntax.outcome == 'success' && steps.enrich.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 health_check.py 2>&1 | tee metadata-health.log

      - name: Publish healthy metadata or preserve cache progress
        id: publish
        if: ${{ !cancelled() && steps.syntax.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.enrich.outcome }}" = "success" ] && \
             [ "${{ steps.validate.outcome }}" = "success" ]; then
            python3 publish_data.py --mode full \
              --message "Refresh Netflix display metadata [skip ci]" \
              2>&1 | tee metadata-publication.log
          else
            python3 publish_data.py --mode cache \
              --message "Preserve Netflix metadata cache progress [skip ci]" \
              2>&1 | tee metadata-publication.log
          fi

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Netflix Display Metadata Refresh"
            for stage in syntax refresh health publication; do
              echo
              echo "### $stage"
              echo
              echo "~~~text"
              cat "metadata-$stage.log" 2>/dev/null || echo "$stage did not run."
              echo "~~~"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve refresh logs and cache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netflix-metadata-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            metadata-*.log
            metadata_cache.json

      - name: Open or refresh metadata issue
        if: >
          always() && !cancelled() && (
            steps.syntax.outcome != 'success' ||
            steps.enrich.outcome != 'success' ||
            steps.validate.outcome != 'success' ||
            steps.publish.outcome != 'success')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Metadata Check] Netflix display metadata unhealthy';

            function read(path, fallback) {
              try {
                return fs.readFileSync(path, 'utf8');
              } catch (_) {
                return fallback;
              }
            }

            let log = [
              '### Syntax',
              '~~~text',
              read('metadata-syntax.log', 'No syntax log.'),
              '~~~',
              '',
              '### Enrichment',
              '~~~text',
              read('metadata-refresh.log', 'No enrichment log.'),
              '~~~',
              '',
              '### Validation',
              '~~~text',
              read('metadata-health.log', 'No validation log.'),
              '~~~',
              '',
              '### Publication',
              '~~~text',
              read('metadata-publication.log', 'Publication did not run.'),
              '~~~'
            ].join('\n');

            if (log.length > 55000) {
              log = log.slice(0, 55000) + '\n... log truncated ...';
            }

            const runUrl =
              context.serverUrl + '/' + owner + '/' + repo +
              '/actions/runs/' + context.runId;

            const body = [
              'The Netflix display metadata pipeline is not healthy.',
              '',
              'Workflow run: ' + runUrl,
              'Checked at: ' + new Date().toISOString(),
              'Outcomes: syntax=${{ steps.syntax.outcome }}, enrichment=${{ steps.enrich.outcome }}, validation=${{ steps.validate.outcome }}, publication=${{ steps.publish.outcome }}',
              '',
              log,
              '',
              '_This issue is managed automatically by the metadata workflow._'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title
            );

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }

      - name: Close recovered metadata issue
        if: >
          always() && !cancelled() &&
          steps.syntax.outcome == 'success' &&
          steps.enrich.outcome == 'success' &&
          steps.validate.outcome == 'success' &&
          steps.publish.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Metadata Check] Netflix display metadata unhealthy';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title
            );

            if (existing) {
              const runUrl =
                context.serverUrl + '/' + owner + '/' + repo +
                '/actions/runs/' + context.runId;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body:
                  'Metadata pipeline has recovered. Recovery run: ' + runUrl
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

      - name: Fail when metadata refresh is unhealthy
        if: >
          always() && !cancelled() && (
            steps.syntax.outcome != 'success' ||
            steps.enrich.outcome != 'success' ||
            steps.validate.outcome != 'success' ||
            steps.publish.outcome != 'success')
        shell: bash
        run: |
          echo "Display metadata refresh or publication failed; see the summary and artifacts."
          exit 1

