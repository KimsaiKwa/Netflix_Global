name: Refresh Netflix Display Metadata

on:
  schedule:
    - cron: "15 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "enrich_metadata.py"
      - "health_check.py"
      - ".github/workflows/netflix-metadata.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: netflix-display-metadata
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 -m py_compile enrich_metadata.py health_check.py 2>&1 | tee metadata-syntax.log

      - name: Refresh cached display metadata
        id: enrich
        if: steps.syntax.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          METADATA_WORKERS=2 \
          JUSTWATCH_MIN_INTERVAL_SECONDS=0.75 \
          python3 enrich_metadata.py 2>&1 | tee metadata-refresh.log

      - name: Validate browser-ready mirror
        id: validate
        if: steps.syntax.outcome == 'success' && steps.enrich.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 health_check.py 2>&1 | tee metadata-health.log

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Netflix Display Metadata Refresh"
            echo
            echo "### Syntax"
            echo
            echo "~~~text"
            cat metadata-syntax.log 2>/dev/null || echo "Syntax check did not run."
            echo "~~~"
            echo
            echo "### Enrichment"
            echo
            echo "~~~text"
            cat metadata-refresh.log 2>/dev/null || echo "Enrichment did not run."
            echo "~~~"
            echo
            echo "### Validation"
            echo
            echo "~~~text"
            cat metadata-health.log 2>/dev/null || echo "Validation did not run."
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit healthy metadata changes
        if: >
          steps.syntax.outcome == 'success' &&
          steps.enrich.outcome == 'success' &&
          steps.validate.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add global.json countries metadata_cache.json

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git commit -m "Refresh Netflix display metadata [skip ci]"
          git pull --rebase origin main
          git push

      - name: Preserve metadata cache progress after incomplete refresh
        if: >
          steps.syntax.outcome == 'success' &&
          steps.enrich.outcome == 'success' &&
          steps.validate.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f metadata_cache.json ]; then
            git add metadata_cache.json
          fi

          if git diff --cached --quiet; then
            echo "No cache progress to preserve."
            exit 0
          fi

          git commit -m "Preserve Netflix metadata cache progress [skip ci]"
          git pull --rebase origin main
          git push

      - name: Open or refresh metadata issue
        if: >
          steps.syntax.outcome == 'failure' ||
          steps.enrich.outcome == 'failure' ||
          steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Metadata Check] Netflix display metadata unhealthy';

            function read(path, fallback) {
              try {
                return fs.readFileSync(path, 'utf8');
              } catch (_) {
                return fallback;
              }
            }

            let log = [
              '### Syntax',
              '~~~text',
              read('metadata-syntax.log', 'No syntax log.'),
              '~~~',
              '',
              '### Enrichment',
              '~~~text',
              read('metadata-refresh.log', 'No enrichment log.'),
              '~~~',
              '',
              '### Validation',
              '~~~text',
              read('metadata-health.log', 'No validation log.'),
              '~~~'
            ].join('\n');

            if (log.length > 55000) {
              log = log.slice(0, 55000) + '\n... log truncated ...';
            }

            const runUrl =
              context.serverUrl + '/' + owner + '/' + repo +
              '/actions/runs/' + context.runId;

            const body = [
              'The Netflix display metadata pipeline is not healthy.',
              '',
              'Workflow run: ' + runUrl,
              'Checked at: ' + new Date().toISOString(),
              '',
              log,
              '',
              '_This issue is managed automatically by the metadata workflow._'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title
            );

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }

      - name: Close recovered metadata issue
        if: >
          steps.syntax.outcome == 'success' &&
          steps.enrich.outcome == 'success' &&
          steps.validate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Metadata Check] Netflix display metadata unhealthy';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title
            );

            if (existing) {
              const runUrl =
                context.serverUrl + '/' + owner + '/' + repo +
                '/actions/runs/' + context.runId;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body:
                  'Metadata pipeline has recovered. Recovery run: ' + runUrl
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

      - name: Fail when metadata refresh is unhealthy
        if: >
          steps.syntax.outcome == 'failure' ||
          steps.enrich.outcome == 'failure' ||
          steps.validate.outcome == 'failure'
        shell: bash
        run: |
          echo "Display metadata refresh is not healthy yet."
          exit 1
