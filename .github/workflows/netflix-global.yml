name: Update Netflix Global Top 10

on:
  schedule:
    - cron: "30 16 * * 2"   # Tuesdays 16:30 UTC, after Netflix weekly publication
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update.py"
      - ".github/workflows/netflix-global.yml"

permissions:
  contents: write

concurrency:
  group: netflix-global-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate global.json
        id: generate
        shell: bash
        run: |
          set +e
          python3 update.py > update.log 2>&1
          CODE=$?
          cat update.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate generated file
        if: steps.generate.outputs.exit_code == '0'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("global.json")
          if not path.exists():
              raise SystemExit("global.json was not generated")

          data = json.loads(path.read_text(encoding="utf-8"))

          if not data.get("week"):
              raise SystemExit("global.json has no week")
          if len(data.get("films", [])) != 10:
              raise SystemExit("global.json films must contain 10 rows")
          if len(data.get("tv", [])) != 10:
              raise SystemExit("global.json tv must contain 10 rows")

          official = data.get("official_categories", {})
          required = [
              "Films (English)",
              "Films (Non-English)",
              "TV (English)",
              "TV (Non-English)",
          ]
          for name in required:
              if len(official.get(name, [])) != 10:
                  raise SystemExit(f"{name} must contain 10 rows")

          print(
              f"Validated Netflix week {data['week']}: "
              f"{len(data['films'])} films / {len(data['tv'])} TV"
          )
          PY

      - name: Prepare diagnostics
        if: always()
        run: |
          if [ "${{ steps.generate.outputs.exit_code }}" = "0" ]; then
            rm -f diagnostics.txt
          else
            {
              echo "Netflix global update failed"
              echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "Runner: ${{ runner.os }}"
              echo "Python: $(python3 --version)"
              echo
              echo "---- update.py output ----"
              cat update.log 2>/dev/null || true
            } > diagnostics.txt
          fi

      - name: Commit generated data or diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A global.json diagnostics.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          if [ -f global.json ] && [ "${{ steps.generate.outputs.exit_code }}" = "0" ]; then
            WEEK=$(python3 -c 'import json; print(json.load(open("global.json", encoding="utf-8"))["week"])')
            git commit -m "Update Netflix global Top 10: week $WEEK [skip ci]"
          else
            git commit -m "Record Netflix global update diagnostics [skip ci]"
          fi

          git push

      - name: Fail workflow when generator failed
        if: steps.generate.outputs.exit_code != '0'
        run: |
          echo "Generator failed. diagnostics.txt has been committed for inspection."
          exit 1
