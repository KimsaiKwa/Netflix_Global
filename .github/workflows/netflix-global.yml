name: Update Netflix Top 10 Data

on:
  schedule:
    - cron: "30 16 * * 2"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update.py"
      - "update_countries.py"
      - "enrich_metadata.py"
      - ".github/workflows/netflix-global.yml"

permissions:
  contents: write

concurrency:
  group: netflix-top10-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Netflix global TSV
        id: download_global
        shell: bash
        run: |
          set +e

          URL="https://top10.netflix.com/data/all-weeks-global.tsv"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            --user-agent "NetflixGlobalMirror/1.0 (+https://github.com/KimsaiKwa/Netflix_Global)" \
            --header "Accept: text/tab-separated-values,text/plain,*/*" \
            --output netflix-global.tsv \
            "$URL" \
            > curl-global.log 2>&1

          CODE=$?

          echo "curl exit code: $CODE"
          cat curl-global.log || true

          if [ "$CODE" -eq 0 ]; then
            BYTES=$(wc -c < netflix-global.tsv | tr -d ' ')
            echo "Downloaded bytes: $BYTES"
            head -n 1 netflix-global.tsv || true

            if [ "$BYTES" -lt 500000 ]; then
              echo "Downloaded global TSV is unexpectedly small."
              CODE=90
            elif ! head -n 1 netflix-global.tsv | grep -q "show_title"; then
              echo "Downloaded global file does not look like Netflix Top 10 TSV."
              CODE=91
            fi
          fi

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Download Netflix country TSV
        id: download_countries
        shell: bash
        run: |
          set +e

          URL="https://top10.netflix.com/data/all-weeks-countries.tsv"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 600 \
            --user-agent "NetflixGlobalMirror/1.0 (+https://github.com/KimsaiKwa/Netflix_Global)" \
            --header "Accept: text/tab-separated-values,text/plain,*/*" \
            --output netflix-countries.tsv \
            "$URL" \
            > curl-countries.log 2>&1

          CODE=$?

          echo "curl exit code: $CODE"
          cat curl-countries.log || true

          if [ "$CODE" -eq 0 ]; then
            BYTES=$(wc -c < netflix-countries.tsv | tr -d ' ')
            echo "Downloaded bytes: $BYTES"
            head -n 1 netflix-countries.tsv || true

            if [ "$BYTES" -lt 5000000 ]; then
              echo "Downloaded country TSV is unexpectedly small."
              CODE=92
            elif ! head -n 1 netflix-countries.tsv | grep -q "country_iso2"; then
              echo "Downloaded country file does not look like Netflix Top 10 TSV."
              CODE=93
            fi
          fi

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate global.json
        id: generate_global
        if: steps.download_global.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          NETFLIX_TSV_FILE=netflix-global.tsv python3 update.py > update-global.log 2>&1
          CODE=$?
          cat update-global.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate country JSONs
        id: generate_countries
        if: steps.download_countries.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          NETFLIX_COUNTRIES_TSV_FILE=netflix-countries.tsv python3 update_countries.py > update-countries.log 2>&1
          CODE=$?
          cat update-countries.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate ranking data
        id: validate_base
        if: >
          steps.download_global.outputs.exit_code == '0' &&
          steps.download_countries.outputs.exit_code == '0' &&
          steps.generate_global.outputs.exit_code == '0' &&
          steps.generate_countries.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e

          python3 - <<'PY' > validate-base.log 2>&1
          import json
          from pathlib import Path

          global_data = json.loads(Path("global.json").read_text(encoding="utf-8"))

          if not global_data.get("week"):
              raise SystemExit("global.json has no week")

          if len(global_data.get("films", [])) != 10:
              raise SystemExit("global.json films must contain 10 rows")

          if len(global_data.get("tv", [])) != 10:
              raise SystemExit("global.json tv must contain 10 rows")

          official = global_data.get("official_categories", {})
          required_categories = [
              "Films (English)",
              "Films (Non-English)",
              "TV (English)",
              "TV (Non-English)",
          ]

          for name in required_categories:
              if len(official.get(name, [])) != 10:
                  raise SystemExit(f"{name} must contain 10 rows")

          required_countries = [
              "us", "kr", "jp",
              "gb", "fr", "de", "es", "it", "nl", "pl",
              "se", "no", "dk", "fi", "be", "at", "ch",
              "pt", "ie", "cz", "gr", "hu", "ro",
          ]

          weeks = {}

          for code in required_countries:
              path = Path("countries") / f"{code}.json"

              if not path.exists():
                  raise SystemExit(f"Missing {path}")

              data = json.loads(path.read_text(encoding="utf-8"))

              week = data.get("week")
              if not week:
                  raise SystemExit(f"{code}: missing week")

              if len(data.get("films", [])) != 10:
                  raise SystemExit(
                      f"{code}: films={len(data.get('films', []))}, expected 10"
                  )

              if len(data.get("tv", [])) != 10:
                  raise SystemExit(
                      f"{code}: tv={len(data.get('tv', []))}, expected 10"
                  )

              weeks.setdefault(week, []).append(code)

          if len(weeks) != 1:
              raise SystemExit(f"Country files are not on one week: {weeks}")

          country_week = next(iter(weeks))
          global_week = global_data["week"]

          if country_week != global_week:
              raise SystemExit(
                  f"Global/country week mismatch: "
                  f"global={global_week}, countries={country_week}"
              )

          print(
              f"Validated base ranking data for week {global_week}: "
              f"global 10+10, {len(required_countries)} countries 10+10"
          )
          PY

          CODE=$?
          cat validate-base.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enrich browser metadata
        id: enrich
        if: steps.validate_base.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e

          METADATA_WORKERS=2 JUSTWATCH_MIN_INTERVAL_SECONDS=0.75 python3 enrich_metadata.py > enrich.log 2>&1
          CODE=$?

          cat enrich.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate final browser-ready mirror
        id: validate_final
        if: steps.enrich.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e

          python3 health_check.py > validate-final.log 2>&1
          CODE=$?

          cat validate-final.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare diagnostics
        if: always()
        shell: bash
        run: |
          DG="\${{ steps.download_global.outputs.exit_code }}"
          DC="\${{ steps.download_countries.outputs.exit_code }}"
          GG="\${{ steps.generate_global.outputs.exit_code }}"
          GC="\${{ steps.generate_countries.outputs.exit_code }}"
          VB="\${{ steps.validate_base.outputs.exit_code }}"
          EN="\${{ steps.enrich.outputs.exit_code }}"
          VF="\${{ steps.validate_final.outputs.exit_code }}"

          SUCCESS=false

          if [ "$DG" = "0" ] && [ "$DC" = "0" ] && \
             [ "$GG" = "0" ] && [ "$GC" = "0" ] && \
             [ "$VB" = "0" ] && [ "$EN" = "0" ] && [ "$VF" = "0" ]; then
            SUCCESS=true
          fi

          echo "success=$SUCCESS" >> "$GITHUB_ENV"

          if [ "$SUCCESS" = "true" ]; then
            rm -f diagnostics.txt
          else
            {
              echo "Netflix Top 10 update failed"
              echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "Runner: \${{ runner.os }}"
              echo "Python: $(python3 --version)"
              echo "download_global=$DG"
              echo "download_countries=$DC"
              echo "generate_global=$GG"
              echo "generate_countries=$GC"
              echo "validate_base=$VB"
              echo "enrich_metadata=$EN"
              echo "validate_final=$VF"
              echo

              echo "---- global curl ----"
              cat curl-global.log 2>/dev/null || true
              echo

              echo "---- countries curl ----"
              cat curl-countries.log 2>/dev/null || true
              echo

              echo "---- global generator ----"
              cat update-global.log 2>/dev/null || true
              echo

              echo "---- country generator ----"
              cat update-countries.log 2>/dev/null || true
              echo

              echo "---- base validation ----"
              cat validate-base.log 2>/dev/null || true
              echo

              echo "---- metadata enrichment ----"
              cat enrich.log 2>/dev/null || true
              echo

              echo "---- final health validation ----"
              cat validate-final.log 2>/dev/null || true
            } > diagnostics.txt
          fi

      - name: Commit generated data or diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$success" = "true" ]; then
            git add global.json countries metadata_cache.json

            if [ -f diagnostics.txt ]; then
              rm -f diagnostics.txt
            fi
            git rm --ignore-unmatch diagnostics.txt >/dev/null 2>&1 || true

            if git diff --cached --quiet; then
              echo "No generated changes to commit."
              exit 0
            fi

            WEEK=$(python3 -c 'import json; print(json.load(open("global.json", encoding="utf-8"))["week"])')
            git commit -m "Update Netflix browser-ready Top 10: week $WEEK [skip ci]"
            git push
            exit 0
          fi

          if [ -f diagnostics.txt ]; then
            git add diagnostics.txt
          fi

          # Preserve successful metadata cache progress even if final poster
          # coverage has not yet crossed the publish threshold. The browser
          # JSON itself is not staged on failure.
          if [ -f metadata_cache.json ]; then
            git add metadata_cache.json
          fi

          if git diff --cached --quiet; then
            echo "No diagnostics changes to commit."
            exit 0
          fi

          git commit -m "Record Netflix Top 10 update diagnostics [skip ci]"
          git push

      - name: Fail workflow when update failed
        if: always()
        shell: bash
        run: |
          if [ "$success" != "true" ]; then
            echo "Netflix Top 10 update failed. Check diagnostics.txt."
            exit 1
          fi

          echo "Netflix browser-ready Top 10 update completed successfully."
